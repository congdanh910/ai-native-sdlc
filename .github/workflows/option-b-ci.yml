name: Option B CI

on:
  pull_request:
    paths:
      - ".github/workflows/option-b-ci.yml"
      - "poc-option-b/**"
      - "AI_Native_SDLC_Option_B.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/option-b-ci.yml"
      - "poc-option-b/**"
      - "AI_Native_SDLC_Option_B.md"

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-option-b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --dev --python 3.12
      - name: Test controller and check browser script
        run: |
          uv run --no-sync pytest -q
          node --check controller/web/app.js
