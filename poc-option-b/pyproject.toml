[project]
name = "ai-native-sdlc-option-b"
version = "0.1.0"
description = "Durable AI-native SDLC proof of concept"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings>=2.0,<3",
  "sqlalchemy==2.1.3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["controller/tests"]
pythonpath = ["."]
