[project]
name = "ai-native-sdlc-option-b"
version = "0.2.0"
description = "Single-operator AI-native SDLC team (Option B v3)"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.1.3",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["controller/tests"]
pythonpath = ["."]
markers = ["integration: needs the local PostgreSQL from docker compose"]
