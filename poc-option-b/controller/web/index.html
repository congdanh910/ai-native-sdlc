<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDLC Control Room</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --line: #e3e3de;
            --ok: #1f7a3a; --warn: #9a6400; --fail: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ecece8; --muted: #a0a09a; --card: #20201e; --line: #34342f;
              --ok: #6fcf8a; --warn: #e3b34f; --fail: #f08a80; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
            border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
    tr:first-child td { border-top: 0; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }
    .status { font-weight: 600; width: 60px; } .name { width: 120px; }
    .hint { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>SDLC Control Room</h1>
  <p id="summary">Checking services…</p>
  <table><tbody id="checks"></tbody></table>
</main>
<script>
  async function refresh() {
    const summary = document.getElementById("summary");
    const body = document.getElementById("checks");
    try {
      const data = await (await fetch("/health/ready")).json();
      summary.textContent = `Readiness: ${data.status}. Runs and the inbox arrive in phase B2.`;
      body.replaceChildren(...data.checks.map((check) => {
        const row = document.createElement("tr");
        for (const [cls, text] of [[`status ${check.status}`, check.status], ["name", check.name],
                                   ["", check.detail]]) {
          const cell = document.createElement("td");
          cell.className = cls;
          cell.textContent = text;
          if (!cls && check.hint) {
            const hint = document.createElement("div");
            hint.className = "hint";
            hint.textContent = check.hint;
            cell.append(hint);
          }
          row.append(cell);
        }
        return row;
      }));
    } catch (error) {
      summary.textContent = `Controller unreachable: ${error}`;
    }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
